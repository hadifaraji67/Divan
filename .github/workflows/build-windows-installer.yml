name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "dev"
          } else {
            $v = "${{ github.ref_name }}"
          }
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install ps2exe
        shell: powershell
        run: |
          Install-Module ps2exe -Force -Scope CurrentUser
          Import-Module ps2exe

      - name: Build EXE
        shell: powershell
        run: |
          Write-Host "=== 1. 设置 PSGallery 为受信任 ==="
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          
          Write-Host "=== 2. 安装 ps2exe 模块 ==="
          Install-Module ps2exe -Force -Scope CurrentUser -AllowClobber
          
          Write-Host "=== 3. 导入模块并验证命令 ==="
          Import-Module ps2exe -Force
          Get-Command Invoke-PS2EXE | Select-Object Name, Source
          
          Write-Host "=== 4. 编译 EXE ==="
          $inputFile = "server\install.ps1"
          $outputFile = "server\DivanSetup.exe"
          Invoke-PS2EXE -inputFile $inputFile -outputFile $outputFile -noConsole
          
          Write-Host "=== 5. 验证输出 ==="
          if (Test-Path $outputFile) {
            Get-Item $outputFile | Format-List
            Write-Host "✅ EXE 构建成功"
          } else {
            Write-Error "❌ EXE 未生成"
            exit 1
          }

      - name: Create server tarball
        shell: powershell
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $dir = "divan-server-$version"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Copy-Item -Recurse server/src $dir/
          Copy-Item server/install.ps1 $dir/
          Copy-Item server/uninstall.ps1 $dir/
          Copy-Item server/start.ps1 $dir/
          Copy-Item server/Install-Divan.bat $dir/
          Copy-Item server/DivanSetup.exe $dir/
          Copy-Item server/WINDOWS.md $dir/
          Copy-Item server/iran-preset.sh $dir/
          Copy-Item server/bootstrap.sh $dir/
          Copy-Item server/VPS-IRAN.md $dir/
          Copy-Item server/README.md $dir/
          Copy-Item server/package.json $dir/
          Copy-Item server/package-lock.json $dir/ -ErrorAction SilentlyContinue
          Copy-Item server/.env.example $dir/
          Copy-Item server/config.example.json $dir/
          Copy-Item server/Dockerfile $dir/
          Copy-Item server/docker-compose.yml $dir/
          Copy-Item -Recurse server/deploy $dir/
          Remove-Item -Recurse -Force "$dir/node_modules" -ErrorAction SilentlyContinue
          
          tar -czf "divan-server-$version-windows.tar.gz" $dir
          Remove-Item -Recurse -Force $dir
          Get-Item "divan-server-*-windows.tar.gz" | Format-List

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            server/DivanSetup.exe
            divan-server-*-windows.tar.gz
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
