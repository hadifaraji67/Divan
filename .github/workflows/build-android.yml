name: Build Android APK

# Builds the native Android shell in the cloud (GitHub's servers), so no
# Android Studio or SDK is needed on your phone. Trigger it either by
# pushing to main, or manually from the Actions tab ("Run workflow").
# When it finishes, download the APK from the run's "Artifacts" section.

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: divan-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
