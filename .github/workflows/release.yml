name: Auto Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'نسخه (مثلاً v4.9.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: تعیین نسخه
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "نسخه: $VERSION"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        env:
          VITE_AUTH_ENABLED: 'false'
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: npx vite build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode and validate Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::KEYSTORE_BASE64 not configured"; exit 1; }
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/keystore/divan-release.keystore
          test -s android/keystore/divan-release.keystore || { echo "::error::Decoded keystore empty"; exit 1; }
          ls -la android/keystore/

      - name: Validate signing secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::KEYSTORE_PASSWORD not configured"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::KEY_ALIAS not configured"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::KEY_PASSWORD not configured"; exit 1; }
          echo "✅ همه secrets موجود"

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Signed Release APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/keystore/divan-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: تغییر نام APK
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/divan-${VERSION}.apk"
          ls -la release/

      - name: پاک‌سازی dist از فایل‌های اضافی
        run: |
          cd dist
          find . -name "*.zip" -delete
          find . -name "*.apk" -delete
          cd ..

      - name: ساخت ZIP برای OTA
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd dist
          zip -r -q "../release/web-${VERSION}.zip" .
          cd ..
          echo "فایل‌های ساخته شده:"
          ls -la release/

      - name: ساخت manifest.json
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_NO_V="${VERSION#v}"
          ZIP_NAME="web-${VERSION}.zip"
          echo "ZIP_NAME=${ZIP_NAME}"
          echo "VERSION=${VERSION}"
          ZIP_SIZE=$(stat -c%s "release/${ZIP_NAME}")
          APK_NAME="divan-${VERSION}.apk"
          APK_SIZE=$(stat -c%s "release/${APK_NAME}")
          CHECKSUM="sha256:$(sha256sum release/${ZIP_NAME} | cut -d' ' -f1)"
          MAJOR=$(echo $VERSION_NO_V | cut -d. -f1)
          MINOR=$(echo $VERSION_NO_V | cut -d. -f2)
          PATCH=$(echo $VERSION_NO_V | cut -d. -f3)
          VCODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          cat > manifest.json << MANIFEST_END
          {
            "version": "${VERSION_NO_V}",
            "releaseNotes": "نسخه ${VERSION} — github.com/hadifaraji67/Divan/releases/tag/${VERSION}",
            "ota": {
              "available": true,
              "url": "https://github.com/hadifaraji67/Divan/releases/download/${VERSION}/${ZIP_NAME}",
              "size": ${ZIP_SIZE},
              "checksum": "${CHECKSUM}",
              "minNativeVersion": "4.9.0"
            },
            "apk": {
              "available": true,
              "url": "https://github.com/hadifaraji67/Divan/releases/download/${VERSION}/${APK_NAME}",
              "size": ${APK_SIZE},
              "versionCode": ${VCODE}
            },
            "requiresNativeUpdate": false,
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          MANIFEST_END

          cat manifest.json

      - name: ایجاد Release خودکار
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "دیوان ${{ steps.version.outputs.version }}"
          body: |
            ## 🎉 نسخه ${{ steps.version.outputs.version }}

            ### 📱 نصب APK (بار اول)
            1. فایل `divan-${{ steps.version.outputs.version }}.apk` را دانلود کنید
            2. روی گوشی نصب کنید

            ### ⚡ بروزرسانی OTA (از v4.9.1 به بعد)
            - به‌طور خودکار در اپ اطلاع داده می‌شود
            - فقط `web-${{ steps.version.outputs.version }}.zip` دانلود می‌شود (~۴۸۴ KB)

            ---
            **نسخه PWA آنلاین:** [divan-one.vercel.app](https://divan-one.vercel.app)
          files: |
            release/*.apk
            release/*.zip
            manifest.json
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          overwrite_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

