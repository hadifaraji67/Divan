name: Auto Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'نسخه (مثلاً v3.3.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: تعیین نسخه
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "نسخه: $VERSION"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        env:
          VITE_AUTH_ENABLED: 'false'
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: npx vite build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: تغییر نام APK
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk "release/divan-${VERSION}.apk"
          ls -la release/

      - name: ایجاد Release خودکار
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "دیوان ${{ steps.version.outputs.version }}"
          body: |
            ## 🎉 نسخه ${{ steps.version.outputs.version }}

            ### 📱 نصب APK
            1. فایل `divan-${{ steps.version.outputs.version }}.apk` را دانلود کنید
            2. روی گوشی اندروید نصب کنید
            3. اگر پیام «منابع ناشناس» داد → **Allow** بزنید

            ### ✨ تغییرات این نسخه
            این بخش به‌صورت خودکار از commit‌های قبلی ساخته می‌شود. برای مشاهده جزئیات کامل، به [لیست commits](https://github.com/${{ github.repository }}/commits/${{ steps.version.outputs.version }}) مراجعه کنید.

            ### 🔄 آپدیت خودکار
            اگر نسخه قبلی را نصب کرده‌اید، هنگام باز کردن نرم‌افزار پیام آپدیت نشان داده می‌شود.

            ---
            **نسخه PWA آنلاین:** [divan-one.vercel.app](https://divan-one.vercel.app)
          files: |
            release/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: خلاصه
        run: |
          echo "## ✅ Release ${{ steps.version.outputs.version }} ساخته شد" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 [دانلود APK](https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.version }})" >> $GITHUB_STEP_SUMMARY
