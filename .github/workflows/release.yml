name: Auto Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'نسخه (مثلاً v3.3.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: تعیین نسخه
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "نسخه: $VERSION"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        env:
          VITE_AUTH_ENABLED: 'false'
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: npx vite build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode and validate Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::KEYSTORE_BASE64 is not configured"; exit 1; }
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/keystore/divan-release.keystore
          test -s android/keystore/divan-release.keystore || { echo "::error::Decoded keystore is empty"; exit 1; }
          ls -la android/keystore/

      - name: Validate signing secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::KEYSTORE_PASSWORD is not configured"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::KEY_ALIAS is not configured"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::KEY_PASSWORD is not configured"; exit 1; }
          echo "✅ همه secrets موجود هستند"

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Signed Release APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/keystore/divan-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: تغییر نام APK
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/divan-${VERSION}.apk"
          ls -la release/

      - name: ساخت ZIP برای OTA
        run: |
          mkdir -p release
          cd dist && zip -r -q "../release/web-${{ steps.version.outputs.version }}.zip" .
          cd ..
          echo "ZIP ساخته شد:"
          ls -la release/

      - name: به‌روزرسانی manifest.json
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_NO_V="${VERSION#v}"
          ZIP_NAME="web-${VERSION}.zip"
          ZIP_SIZE=$(stat -c%s "release/${ZIP_NAME}")
          APK_NAME="divan-${VERSION}.apk"
          APK_SIZE=$(stat -c%s "release/${APK_NAME}")
          CHECKSUM="sha256:$(sha256sum release/${ZIP_NAME} | cut -d' ' -f1)"

          cat > manifest.json << EOF
          {
            "version": "${VERSION_NO_V}",
            "releaseNotes": "نسخه ${VERSION} — برای جزئیات: github.com/hadifaraji67/Divan/releases/tag/${VERSION}",
            "ota": {
              "available": true,
              "url": "https://github.com/hadifaraji67/Divan/releases/download/${VERSION}/${ZIP_NAME}",
              "size": ${ZIP_SIZE},
              "checksum": "${CHECKSUM}",
              "minNativeVersion": "4.9.0"
            },
            "apk": {
              "available": true,
              "url": "https://github.com/hadifaraji67/Divan/releases/download/${VERSION}/${APK_NAME}",
              "size": ${APK_SIZE},
              "versionCode": 40900
            },
            "requiresNativeUpdate": false,
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          echo "manifest.json:"
          cat manifest.json
          echo ""
          echo "📌 این فایل باید در commit جدید روی main قرار بگیرد (workflow جداگانه انجام می‌دهد)"

      - name: ذخیره manifest به عنوان artifact
        uses: actions/upload-artifact@v4
        with:
          name: manifest
          path: manifest.json

      - name: ایجاد Release خودکار
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "دیوان ${{ steps.version.outputs.version }}"
          body: |
            ## 🎉 نسخه ${{ steps.version.outputs.version }}

            ### 📱 نصب APK
            1. فایل `divan-${{ steps.version.outputs.version }}.apk` را دانلود کنید
            2. روی گوشی اندروید نصب کنید
            3. اگر پیام «منابع ناشناس» داد → **Allow** بزنید

            ### ✨ تغییرات این نسخه
            این بخش به‌صورت خودکار از commit‌های قبلی ساخته می‌شود. برای مشاهده جزئیات کامل، به [لیست commits](https://github.com/${{ github.repository }}/commits/${{ steps.version.outputs.version }}) مراجعه کنید.

            ### 🔄 آپدیت خودکار
            اگر نسخه قبلی را نصب کرده‌اید، هنگام باز کردن نرم‌افزار پیام آپدیت نشان داده می‌شود.

            ---
            **نسخه PWA آنلاین:** [divan-one.vercel.app](https://divan-one.vercel.app)
          files: |
            release/*.apk
            release/*.zip
            manifest.json
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: خلاصه
        run: |
          echo "## ✅ Release ${{ steps.version.outputs.version }} ساخته شد" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 [دانلود APK](https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.version }})" >> $GITHUB_STEP_SUMMARY
