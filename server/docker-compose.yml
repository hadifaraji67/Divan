version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: divan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: divan_app
      POSTGRES_PASSWORD: divan1234
      POSTGRES_DB: divan
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U divan_app"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    image: node:20-alpine
    container_name: divan-server
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run migrate && npm start"
    environment:
      NODE_ENV: production
    volumes:
      - ./:/app
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
