# ═══════════════════════════════════════════════════════════
#  Nginx Reverse Proxy برای دیوان
#  مسیر نصب: /etc/nginx/sites-available/divan
#  فعال‌سازی: ln -s /etc/nginx/sites-available/divan /etc/nginx/sites-enabled/
# ═══════════════════════════════════════════════════════════

# ─── Redirect HTTP → HTTPS ───
server {
    listen 80;
    listen [::]:80;
    server_name divan.example.com;   # ← دامنه خودت رو بذار

    # اجازه به ACME challenge برای certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # بقیه → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── Main HTTPS Server ───
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name divan.example.com;   # ← دامنه خودت رو بذار

    # ─── SSL Certificates (Let's Encrypt) ───
    ssl_certificate     /etc/letsencrypt/live/divan.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/divan.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/divan.example.com/chain.pem;

    # ─── SSL Security ───
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ─── Security Headers ───
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Max body size (برای sync) ───
    client_max_body_size 50M;

    # ─── Timeouts ───
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # ─── Proxy به Node.js ───
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ─── Health check بدون auth ───
    location /api/health {
        proxy_pass http://127.0.0.1:4000;
        access_log off;
    }
}
